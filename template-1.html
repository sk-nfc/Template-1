I<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    /* ==============================================================
       ПАНЕЛЬ УПРАВЛЕНИЯ ВИЗИТКОЙ (МЕНЯТЬ ДАННЫЕ ЗДЕСЬ)
       ============================================================== */
    const CONFIG = {
      // 1. Текстовые данные владельца:
      name:        "SERGEI KONIGIN",
      title:       "CEO",
      company:     "VIKSERI KULMATEHNIKA OÜ",
      phone:       "+372 53463477",
      email:       "sergei.k@vikseri.ee",
      website:     "https://vikseri.ee",
      whatsapp:    "37253463477",
      location:    "Betooni 15, Tallinn, Estonia",

      // 2. Имена загруженных файлов картинок:
      coverImage:  "./cover.jpg",
      avatarImage: "./photo.jpg",
      logoImage:   "./logo.jpg",       // Указан ваш загруженный файл logo.jpg

      // 3. Фон визитки (цвет или текстура):
      cardBackground: "#161616",

      // 4. Калибровка фото и окошка логотипа:
      photoOffsetY: "20%",           // Смещение лица по высоте (0% - вверх, 50% - центр)
      photoZoom:    "100%",          // Масштаб фото в круге
      logoBoxColor: "#d4af37",       // Цвет плашки под логотипом
      logoScale:    "80%"            // Размер логотипа внутри плашки
    };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
    }
    .card-container {
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #d4af37;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }
    .cover-image {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
    }
    .identity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-top: -55px;
      position: relative;
      z-index: 2;
    }
    .avatar-wrapper {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      overflow: hidden;
      background-color: #000;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo-box {
      width: 110px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 25px;
    }
    .logo-img {
      object-fit: contain;
      display: block;
    }
    .profile-info { padding: 16px 20px 10px; }
    .person-name { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; }
    .person-role { font-size: 0.95rem; font-weight: 600; color: #d4af37; text-transform: uppercase; margin-bottom: 3px; }
    .person-company { font-size: 0.9rem; color: #a0a0a0; }
    .contacts-list { padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      background: #222222;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .contact-icon { width: 24px; font-size: 1.1rem; color: #d4af37; margin-right: 12px; }
    .save-vcard-btn { background: #d4af37; color: #000000; font-weight: 700; justify-content: center; border: none; cursor: pointer; }
    .save-vcard-btn .contact-icon { color: #000000; }
  </style>
</head>
<body>

  <div class="card-container" id="cardContainer">
    <img id="coverEl" class="cover-image" src="" alt="Cover" onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80'">

    <div class="identity-row">
      <div class="avatar-wrapper">
        <img id="avatarEl" class="avatar-img" src="" alt="Avatar" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80'">
      </div>
      <div class="logo-box" id="logoBox">
        <img id="logoEl" class="logo-img" src="" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerText='LOGO';">
      </div>
    </div>

    <div class="profile-info">
      <h1 class="person-name" id="nameEl"></h1>
      <div class="person-role" id="titleEl"></div>
      <div class="person-company" id="companyEl"></div>
    </div>

    <div class="contacts-list">
      <a id="phoneLink" href="" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
        <span id="phoneText"></span>
      </a>
      <a id="emailLink" href="" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
        <span id="emailText"></span>
      </a>
      <a id="webLink" href="" target="_blank" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-globe"></i></div>
        <span id="webText"></span>
      </a>
      <a id="waLink" href="" target="_blank" class="contact-item">
        <div class="contact-icon"><i class="fa-brands fa-whatsapp"></i></div>
        <span>WhatsApp</span>
      </a>
      <div class="contact-item" style="cursor: default;">
        <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
        <span id="locText"></span>
      </div>
      <button onclick="downloadVCard()" class="contact-item save-vcard-btn">
        <div class="contact-icon"><i class="fa-solid fa-address-card"></i></div>
        <span>Сохранить в контакты</span>
      </button>
    </div>
  </div>

  <script>
    document.getElementById('cardContainer').style.background = CONFIG.cardBackground;
    document.getElementById('coverEl').src = CONFIG.coverImage;
    
    const avatar = document.getElementById('avatarEl');
    avatar.src = CONFIG.avatarImage;
    avatar.style.objectPosition = `50% ${CONFIG.photoOffsetY}`;
    avatar.style.transform = `scale(${CONFIG.photoZoom})`;

    const logoBox = document.getElementById('logoBox');
    logoBox.style.backgroundColor = CONFIG.logoBoxColor;
    const logo = document.getElementById('logoEl');
    logo.src = CONFIG.logoImage;
    logo.style.maxWidth = CONFIG.logoScale;
    logo.style.maxHeight = CONFIG.logoScale;

    document.getElementById('nameEl').innerText = CONFIG.name;
    document.getElementById('titleEl').innerText = CONFIG.title;
    document.getElementById('companyEl').innerText = CONFIG.company;

    document.getElementById('phoneLink').href = `tel:${CONFIG.phone.replace(/\\s+/g, '')}`;
    document.getElementById('phoneText').innerText = CONFIG.phone;

    document.getElementById('emailLink').href = `mailto:${CONFIG.email}`;
    document.getElementById('emailText').innerText = CONFIG.email;

    document.getElementById('webLink').href = CONFIG.website;
    document.getElementById('webText').innerText = CONFIG.website.replace(/^https?:\\/\\//, '');

    document.getElementById('waLink').href = `https://wa.me/${CONFIG.whatsapp.replace(/[^0-9]/g, '')}`;
    document.getElementById('locText').innerText = CONFIG.location;

    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
FN:${CONFIG.name}
ORG:${CONFIG.company}
TITLE:${CONFIG.title}
TEL;TYPE=CELL:${CONFIG.phone}
EMAIL:${CONFIG.email}
URL:${CONFIG.website}
ADR;TYPE=WORK:;;${CONFIG.location};;;
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const a = document.createElement('a');
      a.download = `${CONFIG.name}.vcf`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  </script>
</body>
</html>
