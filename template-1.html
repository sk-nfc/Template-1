<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ==========================================
       НАСТРОЙКИ: ТЕКСТ И КАЛИБРОВКА КАРТИНОК
       ========================================== */
    :root {
      /* Фон карточки */
      --card-bg: #141414;

      /* Калибровка фото (если лицо не по центру):
         0% - макушка, 50% - центр, 100% - подбородок */
      --photo-y: 20%;
      --photo-zoom: 100%;

      /* Окошко логотипа */
      --logo-box-bg: #d4af37;
      --logo-size: 80%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
    }
    .card-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #d4af37;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }
    .cover-image {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
    }
    .identity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-top: -55px;
      position: relative;
      z-index: 2;
    }
    .avatar-wrapper {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      overflow: hidden;
      background-color: #000;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center var(--photo-y);
      transform: scale(var(--photo-zoom));
      display: block;
    }
    .logo-box {
      width: 110px;
      height: 60px;
      border-radius: 12px;
      background-color: var(--logo-box-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 25px;
    }
    .logo-img {
      max-width: var(--logo-size);
      max-height: var(--logo-size);
      object-fit: contain;
      display: block;
    }
    .profile-info { padding: 16px 20px 10px; }
    .person-name { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; }
    .person-role { font-size: 0.95rem; font-weight: 600; color: #d4af37; text-transform: uppercase; margin-bottom: 3px; }
    .person-company { font-size: 0.9rem; color: #a0a0a0; }
    .contacts-list { padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      background: #222222;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .contact-icon { width: 24px; font-size: 1.1rem; color: #d4af37; margin-right: 12px; }
    .save-vcard-btn { background: #d4af37; color: #000000; font-weight: 700; justify-content: center; border: none; cursor: pointer; }
    .save-vcard-btn .contact-icon { color: #000000; }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- 1. Ваша обложка -->
    <img src="cover.jpg" alt="Обложка" class="cover-image">

    <!-- 2. Ваше фото и логотип -->
    <div class="identity-row">
      <div class="avatar-wrapper">
        <img src="photo.jpg" alt="Фото" class="avatar-img">
      </div>
      <div class="logo-box">
        <img src="logo.jpg" alt="Логотип" class="logo-img">
      </div>
    </div>

    <!-- 3. Ваши данные -->
    <div class="profile-info">
      <h1 class="person-name">Сергей</h1>
      <div class="person-role">Руководитель</div>
      <div class="person-company">Vikseri Külmatehnika OÜ</div>
    </div>

    <!-- 4. Кнопки контактов -->
    <div class="contacts-list">
      <a href="tel:+37200000000" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
        <span>+372 0000 0000</span>
      </a>

      <a href="mailto:info@vikseri.ee" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
        <span>info@vikseri.ee</span>
      </a>

      <a href="https://vikseri.ee" target="_blank" class="contact-item">
        <div class="contact-icon"><i class="fa-solid fa-globe"></i></div>
        <span>vikseri.ee</span>
      </a>

      <a href="https://wa.me/37200000000" target="_blank" class="contact-item">
        <div class="contact-icon"><i class="fa-brands fa-whatsapp"></i></div>
        <span>WhatsApp</span>
      </a>

      <div class="contact-item" style="cursor: default;">
        <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
        <span>Tallinn, Estonia</span>
      </div>

      <button onclick="downloadVCard()" class="contact-item save-vcard-btn">
        <div class="contact-icon"><i class="fa-solid fa-address-card"></i></div>
        <span>Сохранить в контакты</span>
      </button>
    </div>
  </div>

  <script>
    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
FN:Сергей
ORG:Vikseri Külmatehnika OÜ
TITLE:Руководитель
TEL;TYPE=CELL:+37200000000
EMAIL:info@vikseri.ee
URL:https://vikseri.ee
ADR;TYPE=WORK:;;Tallinn, Estonia;;;
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const a = document.createElement('a');
      a.download = `Сергей.vcf`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  </script>
</body>
</html>
